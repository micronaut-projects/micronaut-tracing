pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.micronaut.build.shared.settings' version '8.1.4'
}

rootProject.name = 'tracing-parent'

include 'tracing-annotation'
include 'tracing-bom'
include 'tracing-core'
include 'tracing-zipkin-http-client'

// Micrometer Tracing

include 'tracing-micrometer'
include 'tracing-micrometer-brave'
include 'tracing-micrometer-opentelemetry'

// OpenTelemetry

include 'tracing-opentelemetry'
include 'tracing-opentelemetry-annotation'
include 'tracing-opentelemetry-grpc'
include 'tracing-opentelemetry-http'
include 'tracing-opentelemetry-inspector'
include 'tracing-opentelemetry-jdbc'
include 'tracing-opentelemetry-jms'
include 'tracing-opentelemetry-kafka'
include 'tracing-opentelemetry-r2dbc'
include 'tracing-opentelemetry-rabbitmq'
include 'tracing-opentelemetry-redis'
include 'tracing-opentelemetry-test'
include 'tracing-opentelemetry-ucp'
include 'tracing-opentelemetry-zipkin-exporter'

// OpenTracing

include 'tracing-opentracing'
include 'tracing-jaeger'
include 'tracing-brave'
include 'tracing-brave-http'

include 'tests:kotlin-tests'
include 'tests:kotlin-ksp-tests'
include 'test-suite-java'
include 'test-suite-kotlin'
include 'test-suite-groovy'
include 'test-suite-python'
include 'test-suite-opentelemetry-native'

// JMH benchmarks: not published, not part of the BOM
include 'benchmarks'

enableFeaturePreview 'TYPESAFE_PROJECT_ACCESSORS'

micronautBuild {
    useStandardizedProjectNames = true
    nonStandardProjectNamePrefixes.add('benchmarks')
    importMicronautCatalog()
    importMicronautCatalog("micronaut-grpc")
    importMicronautCatalog("micronaut-reactor")
    importMicronautCatalog("micronaut-rxjava3")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-kafka")
    importMicronautCatalog("micronaut-jms")
    importMicronautCatalog("micronaut-data")
    importMicronautCatalog("micronaut-r2dbc")
    importMicronautCatalog("micronaut-redis")
    importMicronautCatalog("micronaut-sql")
}

// Micronaut Core 5.3.0-SNAPSHOT comes from the Central snapshots repository. Only io.micronaut
// snapshots are resolved from it. Projects declare their own repositories, which replace the
// settings ones, so it is added to each project too. To build against a core checkout instead,
// pass --include-build <path-to-micronaut-core>. Remove once the build moves to a core release.
def micronautSnapshotRepositories = { RepositoryHandler repositories ->
    repositories.maven {
        url = "https://central.sonatype.com/repository/maven-snapshots/"
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroupByRegex("io\\.micronaut(\\..*)?")
        }
    }
}
dependencyResolutionManagement {
    micronautSnapshotRepositories(repositories)
    repositories {
        mavenCentral()
    }
}
gradle.beforeProject {
    micronautSnapshotRepositories(it.repositories)
}
