plugins {
    id 'io.micronaut.build.internal.kotlin-kapt'
    id 'io.micronaut.build.internal.tracing-tests'
}

// The examples of the guide, in Kotlin, processed with kapt.
dependencies {
    kaptTest mn.micronaut.inject.java
    kaptTest projects.micronautTracingOpentelemetryAnnotation

    testImplementation mn.kotlin.stdlib.jdk8
    testImplementation projects.micronautTracingOpentelemetryHttp
    testImplementation mn.micronaut.http.server.netty
    testImplementation mn.micronaut.http.client
    testImplementation mn.reactor
    testImplementation mnSerde.micronaut.serde.jackson
    testImplementation projects.micronautTracingOpentelemetryTest
    testImplementation libs.managed.opentelemetry.contrib.aws.resources
    testImplementation projects.micronautTracingOpentelemetryInspector
    testImplementation mnTest.micronaut.test.junit5

    testRuntimeOnly mnTest.junit.jupiter.engine
    testRuntimeOnly mnTest.junit.platform.launcher
    testRuntimeOnly mnLogging.logback.classic
}

test {
    useJUnitPlatform()
}
