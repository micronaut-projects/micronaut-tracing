plugins {
    id 'io.micronaut.build.internal.kotlin-ksp'
}

// Kotlin sources processed with KSP: the method elements carry the JVM (possibly mangled) names.
dependencies {
    kspTest mn.micronaut.inject.kotlin
    kspTest projects.micronautTracingOpentelemetryAnnotation

    testImplementation projects.micronautTracingOpentelemetry
    testImplementation projects.micronautTracingOpentracing
    testImplementation projects.micronautTracingOpentelemetryHttp
    testImplementation mn.micronaut.http.server.netty
    testImplementation mn.micronaut.http.client
    testImplementation mnSerde.micronaut.serde.jackson
    testImplementation mn.kotlin.stdlib.jdk8
    testImplementation mn.kotlinx.coroutines.core
    testImplementation mn.kotlinx.coroutines.reactor
    testImplementation mnReactor.micronaut.reactor
    testImplementation libs.opentelemetry.sdk
    testImplementation libs.opentelemetry.sdk.testing
    testImplementation mnTest.micronaut.test.junit5
    testImplementation libs.junit.jupiter.engine
    testImplementation(mnTest.junit.platform.launcher)
}

test {
    useJUnitPlatform()
}
