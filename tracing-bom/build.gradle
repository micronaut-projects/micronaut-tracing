plugins {
    id 'io.micronaut.build.internal.bom'
}

micronautBom {
    extraExcludedProjects.add 'kotlin-tests'

    suppressions {
        bomAuthorizedGroupIds.put(
                "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom",
                [
                        "io.opentelemetry",
                        "io.opentelemetry.instrumentation",
                        "io.opentelemetry.semconv",
                        "io.opentelemetry.javaagent",
                        "io.opentelemetry.javaagent.instrumentation"
                ] as Set
        )
        bomAuthorizedGroupIds.put(
                "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha",
                [
                        "io.opentelemetry",
                        "io.opentelemetry.instrumentation",
                        "io.opentelemetry.semconv",
                        "io.opentelemetry.javaagent",
                        "io.opentelemetry.javaagent.instrumentation",
                        "io.opentelemetry.javaagent.opentelemetry-javaagent-bootstrap",
                        "io.opentelemetry.javaagent:opentelemetry-testing-common"
                ] as Set
        )
        bomAuthorizedGroupIds.put(
                "io.zipkin.brave:brave-bom",
                [
                        "io.zipkin.brave",
                        "io.zipkin.zipkin2",
                        "io.zipkin.reporter2",
                        "io.zipkin.proto3"
                ] as Set
        )
        bomAuthorizedGroupIds.put(
                "io.zipkin.reporter2:zipkin-reporter-bom",
                [
                        "io.zipkin.reporter2",
                        "io.zipkin.zipkin2",
                        "io.zipkin.proto3"
                ] as Set
        )
        // The OpenTelemetry BOMs import each other, and the catalog imports them directly.
        // Versions come from the catalog so a version bump does not leave stale suppressions behind.
        dependencies.addAll([
                "io.opentelemetry:opentelemetry-bom:${libs.versions.managed.opentelemetry.asProvider().get()}",
                "io.opentelemetry:opentelemetry-bom-alpha:${libs.versions.managed.opentelemetry.alpha.get()}",
                "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${libs.versions.managed.opentelemetry.instrumentation.asProvider().get()}",
                "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:${libs.versions.managed.opentelemetry.instrumentation.alpha.get()}",
        ])
        dependencies.add("io.zipkin.brave:brave-instrumentation-benchmarks:6.3.1")
        dependencies.add("io.zipkin.reporter2:zipkin-reporter-bom:3.5.3")
        bomAuthorizedGroupIds.put(
                "io.micrometer:micrometer-tracing-bom",
                [
                        "io.micrometer"
                ] as Set
        )
        // The 1.7.x Micrometer Tracing BOM does not import micrometer-bom (or list io.micrometer:docs),
        // so only the BOM itself is suppressed. Re-check its POM when bumping the catalog version.
        dependencies.add("io.micrometer:micrometer-tracing-bom:${libs.versions.managed.micrometer.tracing.get()}")
        // Removed from the catalog in 8.4.0 (#952): the artifacts are discontinued upstream and incompatible
        // with the managed OpenTelemetry versions. Kafka instrumentation now uses
        // opentelemetry-kafka-clients-common-0.11, managed by the instrumentation BOM.
        acceptedVersionRegressions.addAll([
                "opentelemetry-instrumentation-kafka-common",
                "opentelemetry-api-events",
                "opentelemetry-instrumentation-api-semconv"
        ])
    }
}
