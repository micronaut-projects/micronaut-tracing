plugins {
    id 'io.micronaut.build.internal.tracing-module'
    id 'io.micronaut.build.internal.kotlin'
}

dependencies {
    api libs.opentracing
    api libs.opentracing.util
    api projects.micronautTracingCore
    api mnReactor.micronaut.reactor

    testImplementation mnReactor.micronaut.reactor
    testImplementation "io.reactivex.rxjava3:rxjava"
    testImplementation mnRxjava3.micronaut.rxjava3.http.client
    testImplementation mnReactor.micronaut.reactor.http.client
    testImplementation project(":micronaut-tracing-jaeger")
    testRuntimeOnly mnSerde.micronaut.serde.jackson
}

// The whole module is deprecated for removal: don't report the removal warnings about its own types.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Xlint:-removal')
}
